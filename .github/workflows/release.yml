name: Signed APK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle and validate the wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install the required Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.$GITHUB_RUN_NUMBER"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/sage-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :watchface:assembleRelease \
            "-PreleaseVersionCode=$RELEASE_VERSION_CODE" \
            "-PreleaseVersionName=$RELEASE_VERSION_NAME"

      - name: Verify signature and prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          APK="Sage-Nocturne-$RELEASE_TAG.apk"
          cp watchface/build/outputs/apk/release/watchface-release.apk "release/$APK"
          APK_SIZE=$(stat -c%s "release/$APK")
          echo "APK size: $APK_SIZE bytes"
          if [ "$APK_SIZE" -lt 5000000 ]; then
            echo "::error::Built APK is abnormally small ($APK_SIZE bytes), assets or resources may have been stripped!"
            exit 1
          fi
          unzip -l "release/$APK" | grep -F "resources.arsc"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "release/$APK" | tee release/signing-certificate.txt
          (cd release && sha256sum "$APK" > "$APK.sha256")

      - name: Publish tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APK="Sage-Nocturne-$RELEASE_TAG.apk"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" == "false" ]]; then
              gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$APK"
              echo "Release already published: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            printf '%s\n' \
              'Signed Wear OS watch-face APK for manual installation on the watch.' \
              '' \
              'Requires Android 16 (API 36) or newer on the watch.' \
              'Select Minimal in the watch-face picker, then Customize to change colors and complications.' \
              '' \
              "Source commit: $GITHUB_SHA" \
              'A release-signature build cannot update a previous debug-signature installation directly.' \
              > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "Sage Nocturne $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "release/$APK" "release/$APK.sha256" \
            release/signing-certificate.txt --clobber
          LATEST=false
          if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')" == "$GITHUB_SHA" ]]; then
            LATEST=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false "--latest=$LATEST"
          URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          printf '## Signed APK published\n\n[Download %s](%s)\n' "$RELEASE_TAG" "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key from the runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/sage-release.jks"
